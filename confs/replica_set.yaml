desc: ""
train:
  exp_name: replica
  max_step: 60000
  batch_size: 4 # image batch
  num_rays: 1024 # ray batch
  custom_sampling: true # enable deflection angle guided sampling

  dynamic_sampling: false # 训练时num_rays动态变化，伴随occupancy grid使用。
  max_num_rays: 8192
  num_samples_per_ray: 512

  log_freq: 10 # per step
  plot_freq: 240 # per epoch
  save_freq: 240
  chunk: 1024
  mesh_resolution: 512 # intermediate mesh resolution
  block_resolution: 512

  train_downscale: 1 # downscale factor for training
  valid_downscale: 1 # downscale factor for validation per plot_freq

dataset:
  scan_id: '1' # id=-1 for custom dataset in data_dir
  data_dir: ./data/Replica
  num_images: 303

  use_mono_depth: true  # apply monocular depth prior
  use_mono_normal: true  # apply monocular normal prior
  use_mask: true # apply mask to filter abnormal priors
  use_uncertainty: false

  use_pts: false


model:
  type: volsdf # 'neus' or 'volsdf'
  bound: 1.0
  white_bg: false
  density:
    # volsdf
    beta_init: 0.1
    beta_min: 1e-4

    # neus
    inv_s_init: 0.3
    scale_factor: 10.0
  object:
    sdf:
      d_in: 3
      d_hidden: 256
      n_layers: 2
      skip: [4]
      geometric_init: true
      bias: 0.9
      norm_weight: true
      inside_outside: true  # default outside for object

      enable_fourier: true # fourier
      N_freqs: 6

      enable_hashgrid: true # hashgrid
      num_levels: 16
      per_level_dim: 2
      log2_hashmap_size: 19
      base_resolution: 16
      max_resolution: 2048
      resolution_list: None

      # Neuralangelo
      enable_progressive: true
      init_active_level: 4
      active_step: 1500
      gradient_mode: numerical # analytical or numerical
      taps: 4

    rgb:
      feat_dim: 256  # sdf feature dim
      d_hidden: 256
      n_layers: 2
      skip: []
      N_freqs: 3
      encoding_view: spherical  # 'fourier' or 'spherical'
      weight_norm: true
      layer_norm: false
      enable_app: true # appearance embedding
      app_dim: 32

  background:
    enabled: false
    type: 'grid_nerf' # "nerf++" or "grid_nerf" background model
    enable_app: false
    app_dim: 8
    nerf_plus_plus: # NeRF++: inverse spherical reparameterization
      d_hidden: 64
      n_layers: 4 # 到density的层数
      skip: [ 4 ]  # density network
      d_hidden_rgb: 64
      n_layers_rgb: 2
      skip_rgb: [ ]
      encoding: fourier
      N_freqs: 10
      encoding_view: spherical
      N_freqs_view: 4
    grid_nerf: # grid_nerf：Mip-Nerf 360 and light hash grid encoding
      d_hidden: 64
      n_layers: 2
      skip: []  # 1-n_layers
      d_hidden_rgb: 64
      n_layers_rgb: 2
      skip_rgb: []
      norm_weight: true

      # position encoding
      enable_fourier: true # fourier
      N_freqs: 6
      enable_hashgrid: true # hashgrid
      num_levels: 16
      per_level_dim: 2
      log2_hashmap_size: 19
      base_resolution: 16
      max_resolution: 2048
      resolution_list: None

      enable_progressive: true
      init_active_level: 4
      active_step: 1500

      # view encoding
      encoding_view: spherical
      N_freqs_view: 4

  # default error bounded sampler
  sampler:
    error_bounded_sampler:
      near: 0.
      N_samples: 64
      N_samples_eval: 128
      N_samples_extra: 32
      N_samples_bg: 32
      N_near: 1
      eps: 0.1
      beta_iters: 10
      max_total_iters: 5
      take_intersection: true
      intersection_type: cube # 'cube' or 'sphere'
    hierarchical_sampler:
      near: 0.
      N_samples_c: 64
      N_samples_f: 16
      N_samples_bg: 32
      N_near: 1
      levels: 4
      take_intersection: true
      intersection_type: sphere # 'cube' or 'sphere'

  occupancy: # occupancy grid acceleration using nerfacc
    enabled: false
    resolution: 128
    prune_threshold: 0.001
    dynamic_step: false

  occupancy_bg:
    enabled: false
    resolution: 256
    prune_threshold: 0.01

  # The Normal Deviation Field
  nbfield:
    enabled: true
    mlp:
      feat_dim: 256
      d_hidden: 256
      n_layers: 2
      skip: []
      N_freqs: 4
      encoding_view: fourier  # 'fourier' or 'spherical'
      weight_norm: true
      layer_norm: false
      enable_app: true
      app_dim: 8

loss:
  # loss format supports sequential_lr: [start_prog, end_prog, start_lr, end_lr]
  # ====================================================================================
  # PARAMETER REBALANCING RULES (Professor's Guidelines)
  # ====================================================================================
  # Loss formulation: L = λ_sdf*L_SDF + λ_eik*L_eik + λ_normal*L_normal + λ_color*Σ_r L_color(r) + β*R(σ)
  # 
  # Parameter mapping:
  #   λ_sdf:   Implicit (SDF loss is core, typically weight=1.0)
  #   λ_eik:   lambda_eik (eikonal loss weight)
  #   λ_normal: lambda_ab_normal (adaptive deflection angle normal loss)
  #   λ_color: weight_unc (heteroscedastic color loss weight)
  #   β:       unc_lambda_reg (uncertainty regularizer weight)
  #   s0:      init_log_sigma (log-variance initialization)
  #
  # QUICK ADJUSTMENT RULES:
  # 
  # 1. If geometry quality degrades (Chamfer ↑, F-score ↓, Normal C. ↓):
  #    - Increase lambda_eik: 0.05 → 0.08-0.1 (stronger eikonal constraint)
  #    - Increase lambda_ab_normal: 0.04 → 0.08 (stronger normal constraint)
  #    - Decrease init_log_sigma: -3.0 → -3.5 (less initial uncertainty)
  #    - Reduce weight_unc: 1.0 → 0.5 (if photometric signal overpowers geometry)
  #
  # 2. If photometric overfitting or noisy textures cause artifacts:
  #    - Increase unc_lambda_reg: 0.03 → 0.05 (stronger σ regularization to prevent collapse/inflation)
  #    - Increase init_log_sigma slowly: -3.0 → -2.5 (only if geometry remains stable)
  #
  # TUNING PROCEDURE (Automated Grid Search):
  #   Run short experiments (5k steps) with grid search:
  #     - s0 ∈ {-4, -3, -2}  → init_log_sigma
  #     - β ∈ {0.0, 0.01, 0.05}  → unc_lambda_reg
  #     - λ_color ∈ {0.5, 1.0}  → weight_unc
  #   Choose configuration with best Chamfer + Normal C. compromise on validation set.
  # ====================================================================================
  
  lambda_rgb_l1: 1.0
  lambda_rgb_mse: 0.0
  lambda_s3im: 0.0 # s3im loss
  lambda_eik: 0.05 # λ_eik: Eikonal loss weight (increase to 0.08-0.1 if geometry degrades)
  lambda_smooth: 0.005 # smooth loss from monosdf
  lambda_normal: 0.0 # naive normal loss (not used, use lambda_ab_normal instead)
  lambda_depth: 0.0 # naive depth loss
  lambda_curvature: 5e-4 # curvature loss
  lambda_ab_normal: 0.04 # λ_normal: Adaptive deflection angle normal loss (increase to 0.08 if geometry degrades)
  lambda_ab_depth: 0.04 # adaptive deflection angle depth loss
  
  # Heteroscedastic Uncertainty Loss Configuration (ND-SDF Principles)
  # Uncertainty ONLY for color/photometric loss, NOT for SDF/eikonal/normal
  use_uncertainty: true  # Enable heteroscedastic uncertainty for color loss
  use_ssim_uncertainty: false  # Use heteroscedastic formulation (affects RGB L1 loss - replaces standard RGB L1)
  use_variance_regularizer: true  # Enable DINO patch variance regularization (optional)
  
  # Heteroscedastic color loss: L_color(r) = (1/(2σ²)) * ||C - Ĉ||² + (1/2) * log(σ²)
  # This REPLACES standard RGB L1 loss - uncertainty directly affects color learning
  # High σ → down-weight color errors (less penalty for uncertain regions)
  # Low σ → emphasize color errors (more penalty for certain regions)
  weight_unc: 1.0  # λ_color: Weight for heteroscedastic color loss (reduce to 0.5 if photometric overpowers geometry)
  unc_lambda_reg: 0.1  # β: Weight for uncertainty regularizer (increased from 0.05 to prevent σ inflation)
  
  # Log-variance initialization: s_0 = log σ_0
  init_log_sigma: -3.5  # s_0 = -3.5 → σ_0 ≈ 0.03 (lower initial uncertainty to prevent early inflation)
  
  # Sigma clamping: σ ∈ [σ_min, σ_max]
  # CRITICAL: Keep sigma_min clamp for numerical stability (prevents division by zero in 1/σ²)
  # Remove sigma_max clamp (set very high) to allow natural uncertainty growth - regularizer will prevent unbounded growth
  sigma_min: 0.01  # Minimum σ value (prevents numerical overflow when dividing by σ²)
  sigma_max: 1000.0  # Maximum σ value (effectively no clamp - regularizer R(σ) prevents unbounded growth)
  
  # Legacy SSIM parameters (not used in heteroscedastic mode, but kept for compatibility)
  unc_clip_min: 0.1  # Legacy: minimum uncertainty value (not used in heteroscedastic mode, replaced by sigma_min)
  unc_eps: 1e-3  # Epsilon for numerical stability
  ssim_window_size: 5  # Window size for SSIM computation (not used)
  stop_ssim_gradient: true  # Stop gradient from SSIM to RGB (not used)
  ssim_anneal: 0.8  # Annealing parameter for SSIM rate scaling (not used)
  ssim_clip_max: 5.0  # Maximum value to clip scaled SSIM loss (not used)
  
  # Curriculum learning: warmup stage
  # Train without uncertainty for first N_warm steps to help geometry find good initialization
  uncertainty_warmup_steps: 5000  # N_warm: Steps to disable uncertainty (ND-SDF default: 2000-5000)
  
  # Learning rate scaling for uncertainty MLP
  uncertainty_lr_scale: 0.1  # Reduce σ learning rate to 0.1x color LR to avoid quick inflation
  
  # Legacy SSIM uncertainty loss parameters (only used if use_ssim_uncertainty: true)
  ssim_window_size: 5  # Window size for SSIM computation
  stop_ssim_gradient: true  # Stop gradient from SSIM to RGB (for decoupled training)
  
  # Patch variance regularizer parameters (optional)
  variance_weight: 0.1  # Weight for variance regularization
  
  # Training progress-based uncertainty annealing (optional)
  use_uncertainty_annealing: false  # Enable uncertainty weight annealing
  uncertainty_anneal_param: 0.8  # Annealing parameter

# Uncertainty pipeline configuration
uncertainty:
  patch_size: 7  # Size of the patch neighborhood (default 7x7)
  dilation: 2  # Dilation factor for patch sampling (default 2)
  auto_tune: false  # Automatically reduce patch_size/dilation/num_rays for GPUs <= 16GB (disabled - use full settings)
  max_chunk_rays: 16384  # Chunk size for full-image beta rendering (to avoid OOM)

optim:
  type: AdamW
  lr: 1e-3
  lr_scale_grid: 20.0
  lr_scale_density: 1.0
  sched:
    type: exponential_lr # 'two_steps_lr' or 'exponential_lr'
    gamma: 0.1
    two_steps: [300000, 400000] # two steps lr decay
    warm_up_end: 1500 # warm up steps

    anneal_quat_end: 0.2 # percent of total steps to warm up, then start sampling, re-weighting, and unbiasing.
    if_guided_sampling: true
    guided_sampling_params: [25, 15, 4]
    if_reweight: true
    re_weight_params: [25, 15, 2]
    if_unbiased: true
    unbiased_params: [25,10]

