desc: Quick test run - 2000 steps for testing
train:
  exp_name: replica_all8_test
  max_step: 2000
  batch_size: 4
  num_rays: 1024
  custom_sampling: true
  dynamic_sampling: false
  max_num_rays: 8192
  num_samples_per_ray: 512
  log_freq: 10
  plot_freq: 10
  save_freq: 10
  chunk: 1024
  mesh_resolution: 512
  block_resolution: 512
  train_downscale: 1
  valid_downscale: 1
dataset:
  scan_id: '1'
  data_dir: ./data/Replica
  num_images: 303
  use_mono_depth: true
  use_mono_normal: true
  use_mask: true
  use_uncertainty: false
  use_pts: false
model:
  type: volsdf
  bound: 1.0
  white_bg: false
  density:
    beta_init: 0.1
    beta_min: 0.0001
    inv_s_init: 0.3
    scale_factor: 10.0
  object:
    sdf:
      d_in: 3
      d_hidden: 256
      n_layers: 2
      skip:
      - 4
      geometric_init: true
      bias: 0.9
      norm_weight: true
      inside_outside: true
      enable_fourier: true
      N_freqs: 6
      enable_hashgrid: true
      num_levels: 16
      per_level_dim: 2
      log2_hashmap_size: 19
      base_resolution: 16
      max_resolution: 2048
      resolution_list: None
      enable_progressive: true
      init_active_level: 4
      active_step: 1500
      gradient_mode: numerical
      taps: 4
    rgb:
      feat_dim: 256
      d_hidden: 256
      n_layers: 2
      skip: []
      N_freqs: 3
      encoding_view: spherical
      weight_norm: true
      layer_norm: false
      enable_app: true
      app_dim: 32
  background:
    enabled: false
    type: grid_nerf
    enable_app: false
    app_dim: 8
    nerf_plus_plus:
      d_hidden: 64
      n_layers: 4
      skip:
      - 4
      d_hidden_rgb: 64
      n_layers_rgb: 2
      skip_rgb: []
      encoding: fourier
      N_freqs: 10
      encoding_view: spherical
      N_freqs_view: 4
    grid_nerf:
      d_hidden: 64
      n_layers: 2
      skip: []
      d_hidden_rgb: 64
      n_layers_rgb: 2
      skip_rgb: []
      norm_weight: true
      enable_fourier: true
      N_freqs: 6
      enable_hashgrid: true
      num_levels: 16
      per_level_dim: 2
      log2_hashmap_size: 19
      base_resolution: 16
      max_resolution: 2048
      resolution_list: None
      enable_progressive: true
      init_active_level: 4
      active_step: 1500
      encoding_view: spherical
      N_freqs_view: 4
  sampler:
    error_bounded_sampler:
      near: 0.0
      N_samples: 64
      N_samples_eval: 128
      N_samples_extra: 32
      N_samples_bg: 32
      N_near: 1
      eps: 0.1
      beta_iters: 10
      max_total_iters: 5
      take_intersection: true
      intersection_type: cube
    hierarchical_sampler:
      near: 0.0
      N_samples_c: 64
      N_samples_f: 16
      N_samples_bg: 32
      N_near: 1
      levels: 4
      take_intersection: true
      intersection_type: sphere
  occupancy:
    enabled: false
    resolution: 128
    prune_threshold: 0.001
    dynamic_step: false
  occupancy_bg:
    enabled: false
    resolution: 256
    prune_threshold: 0.01
  nbfield:
    enabled: true
    mlp:
      feat_dim: 256
      d_hidden: 256
      n_layers: 2
      skip: []
      N_freqs: 4
      encoding_view: fourier
      weight_norm: true
      layer_norm: false
      enable_app: true
      app_dim: 8
loss:
  lambda_rgb_l1: 1.0
  lambda_rgb_mse: 0.0
  lambda_s3im: 0.0
  lambda_eik: 0.05
  lambda_smooth: 0.005
  lambda_normal: 0.0
  lambda_depth: 0.0
  lambda_curvature: 0.0005
  lambda_ab_normal: 0.04
  lambda_ab_depth: 0.04
  use_uncertainty: true
  use_ssim_uncertainty: true
  use_variance_regularizer: true
  weight_unc: 1.0
  unc_lambda_reg: 0.5
  unc_clip_min: 0.1
  unc_eps: 0.001
  ssim_window_size: 5
  stop_ssim_gradient: true
  ssim_anneal: 0.8
  ssim_clip_max: 5.0
  variance_weight: 0.1
  use_uncertainty_annealing: false
  uncertainty_anneal_param: 0.8
uncertainty:
  patch_size: 7
  dilation: 2
  auto_tune: false
  max_chunk_rays: 16384
optim:
  type: AdamW
  lr: 0.001
  lr_scale_grid: 20.0
  lr_scale_density: 1.0
  sched:
    type: exponential_lr
    gamma: 0.1
    two_steps:
    - 300000
    - 400000
    warm_up_end: 1500
    anneal_quat_end: 0.2
    if_guided_sampling: true
    guided_sampling_params:
    - 25
    - 15
    - 4
    if_reweight: true
    re_weight_params:
    - 25
    - 15
    - 2
    if_unbiased: true
    unbiased_params:
    - 25
    - 10
